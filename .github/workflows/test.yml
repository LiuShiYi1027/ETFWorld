name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装依赖
        run: pip install -r backend/requirements.txt pytest httpx
      - name: 运行测试
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JS 语法检查
        run: |
          cd frontend
          for f in js/api.js js/store.js js/app.js js/pages/*.js; do
            node --check "$f" || exit 1
          done
      - name: 设计走查（impeccable 探测器）
        # 当前为信息性检查：同一版本（3.5.0）在 macOS 本地与干净克隆均 0 命中，
        # 但在 ubuntu runner 上 flat-type-hierarchy / em-dash-overuse 两条被忽略的
        # 规则仍会触发，疑似 runner 环境差异，待排查（见 .impeccable/critique）。
        # 在定位前不阻断 CI，结果仍会打印在日志中。
        continue-on-error: true
        run: npx -y impeccable@3.5.0 detect frontend/index.html
