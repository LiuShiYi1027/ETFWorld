name: release

on:
  push:
    tags: ['v*']

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install -r backend/requirements.txt
      - name: 注入版本号（来自 git tag）
        run: |
          echo "{\"version\": \"${GITHUB_REF_NAME}\"}" > frontend/version.json
      - name: 构建 .app
        run: pyinstaller ETFWorld.spec --clean --noconfirm

      # ---- 可选：签名与公证（在仓库 Variables 里设 MACOS_SIGNING=true 并配置
      #      Secrets: APPLE_CERT_P12(base64 的开发者证书) / APPLE_CERT_PASSWORD /
      #      APPLE_ID / APPLE_APP_PASSWORD(应用专用密码) / APPLE_TEAM_ID）----
      - name: 导入签名证书
        if: vars.MACOS_SIGNING == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          echo "$APPLE_CERT_P12" | base64 -d > /tmp/cert.p12
          security create-keychain -p ci ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          security import /tmp/cert.p12 -k ci.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci ci.keychain
      - name: 签名与公证
        if: vars.MACOS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --deep --force --options runtime --sign "Developer ID Application" dist/ETFWorld.app
          (cd dist && ditto -c -k --keepParent ETFWorld.app ETFWorld-notarize.zip)
          xcrun notarytool submit dist/ETFWorld-notarize.zip \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple dist/ETFWorld.app

      - name: 打包产物
        run: cd dist && zip -r ETFWorld-macos-arm64.zip ETFWorld.app
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ETFWorld-macos-arm64.zip
          generate_release_notes: true

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install -r backend/requirements.txt
      - name: 注入版本号（来自 git tag）
        run: |
          echo "{\"version\": \"${GITHUB_REF_NAME}\"}" > frontend/version.json
      - name: 构建（产出 dist/ETFWorld 目录，内含 ETFWorld.exe）
        run: pyinstaller ETFWorld-windows.spec --clean --noconfirm
      - name: 打包产物
        shell: pwsh
        run: Compress-Archive -Path dist/ETFWorld -DestinationPath dist/ETFWorld-windows-x64.zip
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ETFWorld-windows-x64.zip
          generate_release_notes: true
