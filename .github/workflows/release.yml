name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:  # 手动触发用于验证构建/签名链路（不上传 Release）

# 发布 Release 需要写权限（新仓库默认 GITHUB_TOKEN 只读）
permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install -r backend/requirements.txt
      - name: 注入版本号（来自 git tag）
        run: |
          echo "{\"version\": \"${GITHUB_REF_NAME}\"}" > frontend/version.json
      - name: 构建 .app
        run: pyinstaller ETFWorld.spec --clean --noconfirm

      # ---- 可选：签名与公证（在仓库 Variables 里设 MACOS_SIGNING=true 并配置
      #      Secrets: APPLE_CERT_P12(base64 的开发者证书) / APPLE_CERT_PASSWORD /
      #      APPLE_ID / APPLE_APP_PASSWORD(应用专用密码) / APPLE_TEAM_ID，
      #      步骤见 docs/签名公证配置.md）----
      - name: 导入签名证书
        if: vars.MACOS_SIGNING == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          echo "$APPLE_CERT_P12" | base64 -d > /tmp/cert.p12
          security create-keychain -p ci ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          security import /tmp/cert.p12 -k ci.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci ci.keychain
          security find-identity -v
      - name: 签名 .app（hardened runtime + entitlements）
        if: vars.MACOS_SIGNING == 'true'
        run: |
          codesign --deep --force --options runtime \
            --entitlements assets/entitlements.plist \
            --sign "Developer ID Application" dist/ETFWorld.app
          codesign --verify --deep --strict --verbose=2 dist/ETFWorld.app

      - name: 打包 DMG（含 Applications 快捷方式，拖拽即装）
        run: |
          mkdir -p dist/dmg-stage
          cp -R dist/ETFWorld.app dist/dmg-stage/
          ln -s /Applications dist/dmg-stage/Applications
          hdiutil create -volname ETFWorld -srcfolder dist/dmg-stage \
            -ov -format UDZO dist/ETFWorld-macos-arm64.dmg
      - name: 签名并公证 DMG（公证票 staple 到 DMG，下载即过 Gatekeeper）
        if: vars.MACOS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --sign "Developer ID Application" dist/ETFWorld-macos-arm64.dmg
          xcrun notarytool submit dist/ETFWorld-macos-arm64.dmg \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple dist/ETFWorld-macos-arm64.dmg
          xcrun stapler validate dist/ETFWorld-macos-arm64.dmg

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ETFWorld-macos-arm64.dmg
          generate_release_notes: true

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install -r backend/requirements.txt
      - name: 注入版本号（来自 git tag）
        run: |
          echo "{\"version\": \"${GITHUB_REF_NAME}\"}" > frontend/version.json
      - name: 构建单文件 EXE（onefile，产出 dist/ETFWorld.exe）
        run: pyinstaller ETFWorld-windows.spec --clean --noconfirm
      - name: 重命名产物
        shell: pwsh
        run: Copy-Item dist/ETFWorld.exe dist/ETFWorld-windows-x64.exe
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ETFWorld-windows-x64.exe
          # 发行说明只由 mac job 生成，双 job 同开会重复
          generate_release_notes: false
