<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETFW · 网格策略终端</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/vendor/echarts.min.js"></script>
<style>
:root{
  --bg:#0E1216; --bg2:#11161C; --panel:#161C24; --panel2:#1A212B;
  --line:#1b212a; --line2:#232A33; --line3:#2A323C;
  --text:#D7DEE7; --muted:#8B95A3; --faint:#7E8896;
  --green:#45C76A; --red:#F05B50; --amber:#E2A93C; --grey:#767F8D; --blue:#5C9BF0;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'IBM Plex Sans','PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;min-height:100vh;-webkit-font-smoothing:antialiased;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.up{text-transform:uppercase;letter-spacing:.08em;}
.g{color:var(--green);}.r{color:var(--red);}.a{color:var(--amber);}.m{color:var(--muted);}.f{color:var(--faint);}
::-webkit-scrollbar{width:10px;height:10px;}::-webkit-scrollbar-thumb{background:var(--line2);}::-webkit-scrollbar-track{background:var(--bg2);}

/* ---------- status bar ---------- */
header{display:flex;align-items:stretch;height:46px;border-bottom:1px solid var(--line2);background:var(--bg2);position:sticky;top:0;z-index:30;}
.app-id{display:flex;align-items:center;gap:10px;padding:0 18px;border-right:1px solid var(--line);font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.06em;}
.app-id .sq{width:14px;height:14px;background:var(--green);display:inline-block;}
.app-id b{color:#fff;}
nav{display:flex;}
nav button{font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:var(--muted);background:none;border:none;border-right:1px solid var(--line);
  padding:0 16px;cursor:pointer;transition:.12s;position:relative;}
nav button:hover{color:var(--text);background:var(--panel);}
nav button.active{color:#fff;background:var(--panel2);}
nav button.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--green);}
.statusright{margin-left:auto;display:flex;align-items:center;}
.sb{display:flex;align-items:center;gap:8px;padding:0 16px;border-left:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--muted);height:100%;}
.sb .ind{width:8px;height:8px;background:var(--amber);display:inline-block;}
.sb b{color:var(--text);}

main{max-width:1480px;margin:0 auto;padding:0;}
@keyframes fade{from{transform:translateY(6px);}to{transform:translateY(0);}}
section.page{display:none;opacity:1;}
section.page.on{display:block;}
.fade{animation:fade .3s ease;}
@media(prefers-reduced-motion:reduce){.fade{animation:none;}}

/* bands / titles */
.band{padding:16px 22px;border-bottom:1px solid var(--line);}
.band:last-child{border-bottom:none;}
.band-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.band-head .t{font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:.1em;color:var(--text);}
.band-head .t .bar{color:var(--green);margin-right:8px;}
.band-head .d{color:var(--faint);font-size:11.5px;font-family:var(--mono);}
.band-head .d b{color:var(--muted);}
.titlerow{display:flex;align-items:baseline;gap:14px;padding:18px 22px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.titlerow h1{font-family:var(--mono);font-size:18px;font-weight:600;letter-spacing:.04em;color:#fff;white-space:nowrap;}
.titlerow .desc{color:var(--muted);font-size:12px;line-height:1.5;}
.titlerow .desc code{font-family:var(--mono);color:var(--amber);}
.titlerow .spacer{flex:1;}

/* ---------- KPI / stat strip ---------- */
.kpibar{display:grid;border-bottom:1px solid var(--line2);}
.kpibar.c4{grid-template-columns:repeat(4,1fr);}.kpibar.c5{grid-template-columns:repeat(5,1fr);}
.kpi{padding:14px 18px;border-right:1px solid var(--line);cursor:pointer;position:relative;transition:.12s;border-left:2px solid transparent;}
.kpi.static{cursor:default;}
.kpi:last-child{border-right:none;}
.kpi:not(.static):hover{background:var(--panel);}
.kpi.sel{background:var(--panel2);}
.kpi.go{border-left-color:var(--green);}.kpi.maybe{border-left-color:var(--amber);}
.kpi.wait{border-left-color:var(--grey);}.kpi.no{border-left-color:var(--red);}
.kpi.lz{border-left-color:var(--green);}.kpi.cap{border-left-color:var(--blue);}.kpi.lossz{border-left-color:var(--red);}
.kpi .lab{font-family:var(--mono);font-size:11px;letter-spacing:.07em;color:var(--muted);display:flex;align-items:center;gap:7px;}
.kpi .sq{width:7px;height:7px;display:inline-block;}
.kpi.go .sq{background:var(--green);}.kpi.maybe .sq{background:var(--amber);}
.kpi.wait .sq{background:var(--grey);}.kpi.no .sq{background:var(--red);}
.kpi .v{font-family:var(--mono);font-size:30px;font-weight:600;margin-top:8px;line-height:1;letter-spacing:-.01em;}
.kpi .v.sm{font-size:24px;}
.kpi.go .v{color:var(--green);}.kpi.maybe .v{color:var(--amber);}.kpi.no .v{color:var(--red);}
.kpi .foot{font-size:11px;color:var(--faint);margin-top:7px;font-family:var(--mono);}
.kpi .pctbar{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--line);}
.kpi .pctbar i{display:block;height:100%;}
.kpi.go .pctbar i{background:var(--green);}.kpi.maybe .pctbar i{background:var(--amber);}
.kpi.wait .pctbar i{background:var(--grey);}.kpi.no .pctbar i{background:var(--red);}

/* ---------- split ---------- */
.split{display:grid;grid-template-columns:1.7fr 1fr;}
.split.even{grid-template-columns:1fr 1fr;}
.split > div{border-right:1px solid var(--line);}
.split > div:last-child{border-right:none;}
#chart{width:100%;height:432px;}

/* watchlist */
.wl{display:flex;flex-direction:column;}
.wl-row{display:grid;grid-template-columns:26px 1fr auto 20px;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s;}
.wl-row:hover{background:var(--panel);}
.wl-rank{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--bg);background:var(--green);width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
.wl-row.r2 .wl-rank{background:#37A957;color:#fff;}.wl-row.r3 .wl-rank{background:#2B8645;color:#fff;}
.wl-name{font-size:13.5px;font-weight:500;}
.wl-meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px;}
.wl-score{font-family:var(--mono);text-align:right;}
.wl-score .v{font-size:18px;font-weight:600;color:var(--green);}
.wl-score .l{font-size:10px;color:var(--faint);letter-spacing:.08em;}
.wl-arr{font-family:var(--mono);color:var(--faint);font-size:14px;text-align:right;}
.wl-row:hover .wl-arr{color:var(--green);}
.legend-note{padding:13px 4px 2px;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.9;border-top:1px solid var(--line);margin-top:8px;}
.legend-note b{color:var(--text);}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;border:1px solid var(--line2);width:max-content;}
.seg{display:flex;}
.seg button{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--muted);background:var(--panel);border:none;border-right:1px solid var(--line);padding:7px 14px;cursor:pointer;transition:.12s;}
.seg button:last-child{border-right:none;}
.seg button:hover{color:var(--text);}
.seg button.on{background:var(--panel2);color:var(--green);}
.tools-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
.switch{display:flex;align-items:center;gap:8px;color:var(--muted);font-family:var(--mono);font-size:11.5px;cursor:pointer;user-select:none;}
.switch input{display:none;}
.cb{width:14px;height:14px;border:1px solid var(--line2);display:inline-block;position:relative;background:var(--bg);}
.switch input:checked + .cb{background:var(--green);border-color:var(--green);}
.switch input:checked + .cb::after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg);}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;}
thead th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:right;padding:9px 12px;border-bottom:1px solid var(--line2);border-top:1px solid var(--line2);cursor:pointer;white-space:nowrap;user-select:none;background:var(--bg2);}
thead th:first-child,thead th.l{text-align:left;}
thead th.nos{cursor:default;}
thead th:hover{color:var(--text);}
thead th.sorted{color:var(--green);}
thead th .ar{font-size:9px;margin-left:3px;}
tbody td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px;}
tbody td:first-child,tbody td.l{text-align:left;}
tbody td.sans{font-family:var(--sans);}
tbody tr.clk{cursor:pointer;}
tbody tr.clk:hover{background:var(--panel);}
tbody tr.empty td{text-align:center;color:var(--faint);font-family:var(--mono);padding:24px;}
.sig{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;}
.sig .sq{width:8px;height:8px;display:inline-block;}
.sig .code{font-family:var(--mono);font-size:11px;letter-spacing:.05em;}
.idx-name{font-weight:500;font-size:13px;}
.idx-code{font-family:var(--mono);color:var(--faint);font-size:10.5px;margin-top:1px;}
.cat{font-family:var(--mono);font-size:11px;color:var(--muted);}
.scorewrap{display:inline-flex;align-items:center;gap:9px;justify-content:flex-end;}
.scorebar{width:50px;height:5px;background:var(--line);position:relative;}
.scorebar i{display:block;height:100%;}
.scoreval{font-weight:600;width:34px;text-align:right;}
.pctnum{font-weight:600;}
.gauge{display:inline-block;width:34px;height:4px;background:var(--line);position:relative;vertical-align:middle;margin-left:7px;}
.gauge i{display:block;height:100%;}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:2px 7px;border:1px solid;white-space:nowrap;}
.proxy{color:var(--faint);font-size:9px;vertical-align:super;}
.foot-note{font-family:var(--mono);color:var(--faint);font-size:11px;margin-top:14px;line-height:1.7;}

/* ---------- forms ---------- */
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0;border:1px solid var(--line2);border-bottom:none;}
.field{padding:10px 14px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line);}
.field label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--text);font-family:var(--mono);font-size:13px;padding:6px 8px;outline:none;transition:.12s;}
.field input:focus,.field select:focus{border-color:var(--green);}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.04em;padding:8px 16px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);cursor:pointer;transition:.12s;}
.btn:hover{border-color:var(--line3);background:var(--line);}
.btn.primary{background:rgba(69,199,106,.12);border-color:rgba(69,199,106,.5);color:var(--green);}
.btn.primary:hover{background:rgba(69,199,106,.2);}
.btn.danger{color:var(--red);border-color:rgba(240,91,80,.4);}
.btn.danger:hover{background:rgba(240,91,80,.12);}
.btn.sm{padding:4px 10px;font-size:11px;}
.btnrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
.searchrow{display:flex;gap:0;margin-bottom:12px;border:1px solid var(--line2);width:max-content;max-width:100%;}
.searchrow input{background:var(--bg);border:none;color:var(--text);font-family:var(--mono);font-size:13px;padding:8px 12px;outline:none;width:320px;max-width:60vw;}
.searchrow button{border:none;border-left:1px solid var(--line2);}
.settings-wrap{max-width:900px;}
.settings-section{padding:20px 22px;border-bottom:1px solid var(--line);}
.settings-section h2{font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:var(--text);margin-bottom:6px;}
.settings-section>p{color:var(--muted);font-size:12px;margin-bottom:16px;line-height:1.6;}
.settings-status{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:10px;}
.settings-status i{width:7px;height:7px;background:var(--grey);display:inline-block;}
.settings-status.ok i{background:var(--green);}
.secret-row{position:relative;}
.secret-row input{padding-right:62px;}
.secret-toggle{position:absolute;right:1px;top:1px;bottom:1px;width:58px;border:0;border-left:1px solid var(--line2);background:var(--panel);color:var(--muted);font-family:var(--mono);font-size:10px;cursor:pointer;}

/* planner viz */
#ladder{width:100%;height:380px;}
#pressure{width:100%;height:300px;}
.chart-empty{display:flex;align-items:center;justify-content:center;height:300px;color:var(--faint);font-family:var(--mono);font-size:12px;border:1px dashed var(--line2);}

/* docs */
.doc{max-width:880px;font-size:13.5px;line-height:1.75;}
.doc .sec{padding:18px 22px;border-bottom:1px solid var(--line);}
.doc h3{font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:var(--green);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.doc p{color:var(--text);margin:8px 0;}
.doc p.m{color:var(--muted);}
.doc b{color:#fff;}
.doc .idea{display:grid;grid-template-columns:30px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);}
.doc .idea:last-child{border-bottom:none;}
.doc .idea .num{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--green);}
.doc .idea h4{font-size:14px;margin-bottom:5px;}
.doc .idea p{color:var(--muted);font-size:12.5px;margin:0;}
.doc ol.steps{counter-reset:s;list-style:none;}
.doc ol.steps li{counter-increment:s;position:relative;padding:9px 0 9px 34px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12.5px;}
.doc ol.steps li:last-child{border-bottom:none;}
.doc ol.steps li::before{content:counter(s);position:absolute;left:0;top:9px;font-family:var(--mono);font-size:11px;color:var(--bg);background:var(--green);width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
.doc ol.steps li b{color:var(--text);}
.kv{display:grid;grid-template-columns:120px 1fr;gap:0;border:1px solid var(--line2);}
.kv .k{font-family:var(--mono);font-size:11.5px;color:var(--green);padding:9px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line2);}
.kv .vv{padding:9px 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12.5px;}
.kv .k:last-of-type,.kv .vv:last-of-type{border-bottom:none;}
.warn{border:1px solid rgba(226,169,60,.38);background:rgba(226,169,60,.06);padding:12px 16px;margin-top:6px;border-radius:6px;}
.warn p{color:var(--text);font-size:12.5px;margin:6px 0;}
.warn p::before{content:'! ';color:var(--amber);font-family:var(--mono);font-weight:700;}

/* ticker */
.ticker{display:flex;align-items:center;border-top:1px solid var(--line2);background:var(--bg2);height:30px;font-family:var(--mono);font-size:11px;color:var(--muted);position:sticky;bottom:0;z-index:20;overflow:hidden;}
.ticker .seg2{padding:0 16px;border-right:1px solid var(--line);height:100%;display:flex;align-items:center;gap:7px;white-space:nowrap;}
.ticker .seg2 b{color:var(--text);}

/* toast — full hairline border + leading status square (no side-stripe) */
#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(16px);opacity:0;display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line3);padding:11px 16px;font-family:var(--mono);font-size:12px;transition:.22s ease;pointer-events:none;max-width:82vw;z-index:60;}
#toast::before{content:'';width:7px;height:7px;border-radius:2px;background:var(--green);flex:none;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.err::before{background:var(--red);}
#toast.warn-t::before{background:var(--amber);}
#toast b{color:var(--green);}
#toast.err b{color:var(--red);}
#toast.warn-t b{color:var(--amber);}
@media(max-width:1040px){.split,.split.even{grid-template-columns:1fr;}.split>div{border-right:none;border-bottom:1px solid var(--line);}.kpibar.c4,.kpibar.c5{grid-template-columns:repeat(2,1fr);}}

/* ===== TERMINAL+ refinements (radius / a11y / responsive) ===== */
::-webkit-scrollbar-thumb{border-radius:6px;}
.app-id .sq{border-radius:3px;}
.sb .ind{border-radius:50%;}
.kpi .sq{border-radius:2px;}
.cb{border-radius:3px;}
.chip{border-radius:4px;}
.btn{border-radius:6px;white-space:nowrap;}
.field input,.field select{border-radius:5px;}
.searchrow{border-radius:6px;overflow:hidden;}
.toolbar{border-radius:6px;overflow:hidden;}
.wl-rank{border-radius:5px;}
.wl-row{border-radius:6px;}
.scorebar{border-radius:3px;overflow:hidden;}
.gauge{border-radius:3px;overflow:hidden;}
.formgrid{border-radius:7px 7px 0 0;overflow:hidden;}
.kv{border-radius:7px;overflow:hidden;}
#toast{border-radius:7px;}
.kpi{transition:background .12s,border-color .12s;}
.band-head .d{line-height:1.5;}
.foot-note,.legend-note{line-height:1.75;}
/* focus-visible for keyboard a11y */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:1px;border-radius:4px;}
nav button:focus-visible{outline-offset:-2px;}
.switch input:focus-visible + .cb{outline:2px solid var(--green);outline-offset:2px;}

/* ===== HARDEN: a11y utilities, keyboard, validation ===== */
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
.skip{position:fixed;top:-60px;left:8px;z-index:80;background:var(--panel2);border:1px solid var(--green);color:var(--green);font-family:var(--mono);font-size:12px;padding:8px 14px;border-radius:6px;transition:top .15s ease;}
.skip:focus{top:8px;}

/* status-bar keyboard hint */
.kbd-hint{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted);background:none;border:none;border-left:1px solid var(--line);padding:0 14px;cursor:pointer;height:100%;transition:.12s;}
.kbd-hint:hover{color:var(--text);background:var(--panel);}
kbd{font-family:var(--mono);font-size:10.5px;background:var(--panel2);border:1px solid var(--line3);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--text);}

/* inline field validation */
.field .msg{display:none;font-family:var(--mono);font-size:10px;color:var(--red);margin-top:5px;letter-spacing:.02em;}
.field.err input,.field.err select{border-color:var(--red);}
.field.err .msg{display:block;}

/* two-step confirm button */
.btn.confirming{background:rgba(240,91,80,.18);border-color:var(--red);color:var(--red);}

/* teaching empty states */
tbody tr.empty td .ehint{color:var(--muted);}
tbody tr.empty td .ekey{color:var(--green);}

/* ===== command line (:) ===== */
#cmd-backdrop{position:fixed;inset:0;z-index:69;background:rgba(8,11,14,.45);opacity:0;pointer-events:none;transition:opacity .14s ease;}
#cmd-backdrop.show{opacity:1;pointer-events:auto;}
#cmd{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(10px);width:min(560px,92vw);background:var(--panel2);border:1px solid var(--line3);border-radius:8px;z-index:70;opacity:0;pointer-events:none;transition:opacity .14s ease,transform .14s ease;box-shadow:0 18px 44px rgba(0,0,0,.55);overflow:hidden;}
#cmd.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
#cmd .cmd-in{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);}
#cmd .cmd-in .pfx{color:var(--green);font-family:var(--mono);font-weight:700;font-size:15px;}
#cmd input{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:var(--mono);font-size:14px;}
#cmd .cmd-list{max-height:248px;overflow:auto;}
#cmd .cmd-item{display:flex;align-items:center;gap:14px;padding:9px 14px 9px 26px;position:relative;font-family:var(--mono);font-size:12.5px;color:var(--muted);cursor:pointer;}

<script>
/* ============================================================
   API CLIENT
   ============================================================ */
async function api(path,opts={}){
  const res=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});
  if(!res.ok){let e={};try{e=await res.json();}catch{}throw new Error(e.detail||res.statusText||('HTTP '+res.status));}
  return res.json();
}
function attr(v){return String(v??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;');}

/* ============================================================
   SHARED CONSTANTS + STATE
   ============================================================ */
const LEVEL={
  go:{color:'#45C76A',label:'适合开启',code:'GO'},
  maybe:{color:'#E2A93C',label:'可小仓试探',code:'PROBE'},
  wait:{color:'#767F8D',label:'观望',code:'WAIT'},
  no:{color:'#F05B50',label:'不建议',code:'VETO'},
  unknown:{color:'#5A6472',label:'数据不足',code:'N/A'},
};
const ZONES=[[0,20,'低估','#45C76A'],[20,40,'偏低','#84BB45'],[40,60,'适中','#E2A93C'],[60,80,'偏高','#E4823C'],[80,100,'高估','#F05B50']];
function zoneOf(p){for(const z of ZONES)if(p>=z[0]&&p<z[1])return z;return ZONES[ZONES.length-1];}

/* readiness cache (from /api/readiness) drives RADAR + ticker */
let DATA=[];
let readinessError=null;
function cnt(l){return DATA.filter(d=>d.level===l).length;}
/* map API readiness → internal shape used by RADAR + charts (vol kept as 0–1) */
function normReadiness(d){return {
  ts_code:d.ts_code,name:d.name,category:d.category,close:d.close,
  valuation_pct:d.valuation_percentile,pe_pct:d.pe_percentile,pb_pct:d.pb_percentile,
  vol:(d.volatility==null?null:d.volatility/100),vol_proxy:!!d.volatility_is_proxy,
  score:(d.score==null?0:d.score),level:d.level||'unknown',verdict:d.verdict,
  step:(d.suggested_grid?d.suggested_grid.grid_step:null),
  grid_count:(d.suggested_grid?d.suggested_grid.grid_count:10),
  trade_date:d.trade_date,
};}
async function loadReadiness(){
  try{
    const raw=await api('/api/readiness');
    DATA=raw.map(normReadiness);readinessError=null;
    const dts=DATA.map(d=>d.trade_date).filter(Boolean).sort();
    if(dts.length)$('#asof').textContent=dts[dts.length-1];
  }catch(e){DATA=[];readinessError=e.message;}
}

/* ===== helpers ===== */
const $=s=>document.querySelector(s);
function fmt(v,d=2){return v==null?'—':Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function pnlCls(v){return v>0?'g':v<0?'r':'';}
/* toast(msg, opts): opts.type 'err'|'warn'; opts.action {label, fn} for undo */
function toast(msg,opts={}){
  const t=$('#toast');t.className='';
  if(opts.type==='err')t.classList.add('err');else if(opts.type==='warn')t.classList.add('warn-t');
  if(opts.action){
    t.innerHTML=`<span>${msg}</span><button class="btn sm" id="toast-act" style="margin-left:4px">${opts.action.label}</button>`;
    t.style.pointerEvents='auto';
    const b=t.querySelector('#toast-act');
    b.onclick=()=>{hideToast();opts.action.fn();};
  }else{t.innerHTML=`<span>${msg}</span>`;t.style.pointerEvents='none';}
  requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(t._t);t._t=setTimeout(hideToast,opts.action?6000:3400);
}
function hideToast(){const t=$('#toast');t.classList.remove('show');t.style.pointerEvents='none';}

/* two-step confirm on a destructive/重要 button；label 默认"确认删除?" */
function armConfirm(btn,onConfirm,label){
  if(btn.classList.contains('confirming')){clearTimeout(btn._ct);resetConfirm(btn);onConfirm();return;}
  document.querySelectorAll('.confirming').forEach(resetConfirm);
  btn._orig=btn.textContent;btn.textContent=label||'确认删除?';btn.classList.add('confirming');
  btn._ct=setTimeout(()=>resetConfirm(btn),3500);
}
function resetConfirm(btn){if(!btn||!btn.classList.contains('confirming'))return;clearTimeout(btn._ct);btn.classList.remove('confirming');if(btn._orig)btn.textContent=btn._orig;}

/* inline field validation */
function setFieldErr(sel,msg){const el=$(sel);if(!el)return;const f=el.closest('.field');if(!f)return;
  let m=f.querySelector('.msg');if(!m){m=document.createElement('div');m.className='msg';f.appendChild(m);}
  if(msg){f.classList.add('err');m.textContent=msg;}else f.classList.remove('err');}
function clearFieldErr(sel){setFieldErr(sel,'');}

/* market-hours clock (A股: 周一–五 09:30–11:30 / 13:00–15:00, 本地时间) */
function updateMkt(){
  const el=$('#mkt');if(!el)return;
  const d=new Date(),day=d.getDay(),mins=d.getHours()*60+d.getMinutes();
  const open=day>=1&&day<=5&&((mins>=570&&mins<=690)||(mins>=780&&mins<=900));

  el.querySelector('.ind').style.background=open?'var(--green)':'var(--grey)';

let aiCode=null, aiTimer=null, aiEnabled=null, aiModel=null;
async function aiStatus(){if(aiEnabled!=null)return aiEnabled;try{const s=await api('/api/ai/status');aiEnabled=!!s.enabled;aiModel=s.model||null;}catch{aiEnabled=false;}return aiEnabled;}
function aiVerdictColor(v){return v==='适合'?'#45C76A':v==='谨慎'?'#E2A93C':v==='不适合'?'#F05B50':'#8B95A3';}
function openAIPanel(code){
  const d=DATA.find(x=>x.ts_code===code);if(!d)return;
  aiCode=code;document.body.classList.add('ai-open','ai-everused');
  $('#aipanel').classList.add('open');renderAIHead(d);
  $('#ai-loading').style.display='';$('#ai-stream').textContent='';runAIPanel(d);
}
function closeAIPanel(){$('#aipanel').classList.remove('open');document.body.classList.remove('ai-open');clearInterval(aiTimer);}
function renderAIHead(d){
  const lv=LEVEL[d.level]||LEVEL.unknown, z=d.valuation_pct==null?null:zoneOf(d.valuation_pct);
  $('#ai-name').textContent=d.name;$('#ai-code').textContent=d.ts_code;$('#ai-score').textContent=(d.score??0).toFixed(1);
  $('#ai-rule').innerHTML='规则 <b style="color:'+lv.color+'">'+lv.label+'</b>';
  const vb=$('#ai-verdict');vb.textContent='AI · 分析中';vb.style.color='var(--muted)';vb.style.borderColor='var(--line3)';vb.style.background='transparent';
  $('#ai-stats').innerHTML=
    '<div><div class="k">估值分位</div><div class="vv" style="color:'+(z?z[3]:'var(--faint)')+'">'+(d.valuation_pct==null?'—':d.valuation_pct)+'</div></div>'+
    '<div><div class="k">年化波动</div><div class="vv">'+(d.vol==null?'—':(d.vol*100).toFixed(0)+'%')+'</div></div>'+
    '<div><div class="k">建议间距</div><div class="vv">'+(d.step==null?'—':d.step+'%')+'</div></div>';
}
function fallbackAIPro(d){
  const fit=d.level==='go'?'适合':d.level==='maybe'?'谨慎':d.level==='wait'?'谨慎':'不适合';
  const zone=d.valuation_pct==null?'—':zoneOf(d.valuation_pct)[2];
  return {verdict:fit,
    oneLine:d.name+'估值'+zone+'、波动'+(d.vol==null?'—':(d.vol*100).toFixed(0)+'%')+'，'+(fit==='适合'?'具备开网格条件':fit==='谨慎'?'可小仓试探':'估值偏高暂不建议'),
    reasons:['估值分位 '+(d.valuation_pct??'—')+'，处于'+zone+'区间','年化波动 '+(d.vol==null?'—':(d.vol*100).toFixed(0)+'%')+'，'+(d.vol>0.3?'回摆充足':'中等'),'规则网格分 '+(d.score??0).toFixed(1)+'/100'],
    risks:['趋势性下跌时网格会持续买入加深套牢','满仓后继续下跌需充足资金与耐心'],
    paramHint:'建议间距 '+(d.step??'—')+'%，'+(d.vol>0.3?'波动大可适当加密':'标准配置即可'),source:'rule'};
}
async function runAIPanel(d){
  let data=null, viaAI=false;
  if(await aiStatus()){
    try{data=await api('/api/ai/grid-review',{method:'POST',body:JSON.stringify({ts_code:d.ts_code})});
      viaAI=(data&&data.source==='ai');
    }catch(e){data=null;}
  }
  if(!data)data=fallbackAIPro(d);
  if(aiCode!==d.ts_code)return;
  if(!['适合','谨慎','不适合'].includes(data.verdict))data.verdict=fallbackAIPro(d).verdict;
  showAIResult(data,viaAI);
}
/* AI 计划体检：对一份保存的网格计划做"最脆弱点"分析（上下文=计划参数+服务端压力测试） */

  aiCode='plan-'+id;document.body.classList.add('ai-open','ai-everused');$('#aipanel').classList.add('open');

  $('#ai-score').textContent='—';$('#ai-rule').innerHTML='网格 <b>'+(plan.version||'1.0')+'</b>';
  const cap=(plan.levels||[]).reduce((s,l)=>s+(l.amount||0),0);
  $('#ai-stats').innerHTML='<div><div class="k">格距</div><div class="vv">'+plan.grid_step+'%</div></div>'+
    '<div><div class="k">格数</div><div class="vv">'+plan.grid_count+'</div></div>'+
    '<div><div class="k">满格资金</div><div class="vv">'+fmt(cap,0)+'</div></div>';
  $('#ai-loading').style.display='';$('#ai-stream').textContent='';
  let data=null,viaAI=false;
  if(await aiStatus()){
    try{data=await api('/api/ai/plan-review',{method:'POST',body:JSON.stringify({plan_id:id})});
      viaAI=(data&&data.source==='ai');
    }catch(e){data=null;}
  }
  if(aiCode!=='plan-'+id)return;
  if(!data){
    $('#ai-loading').style.display='none';
    $('#ai-src').textContent='未配置 AI Key · 体检不可用';
    const vb=$('#ai-verdict');vb.textContent='AI · 不可用';vb.style.color='var(--muted)';vb.style.borderColor='var(--line3)';vb.style.background='transparent';
    $('#ai-stream').textContent='计划体检需要配置 AI 服务。\n\n请到右上角「设置 → AI SERVICE」填入任意 OpenAI 兼容服务的 API Key（DeepSeek、Kimi 等），保存后重试。';
    return;
  }
  if(!['适合','谨慎','不适合'].includes(data.verdict))data.verdict='谨慎';
  showAIResult(data,viaAI);
}
function showAIResult(data,viaAI){
  $('#ai-src').textContent=viaAI?(aiModel||'AI')+' · 实时生成 · 独立于规则评分':'规则兜底 · 未配置 AI Key';
  $('#ai-loading').style.display='none';
  const col=aiVerdictColor(data.verdict),vb=$('#ai-verdict');
  vb.textContent='AI · '+data.verdict;vb.style.color=col;vb.style.borderColor=col+'66';vb.style.background=col+'1a';
  const nar='结论\n'+data.oneLine+(data.detail?'\n\n深入解读\n'+data.detail:'')+'\n\n关键依据\n'+(data.reasons||[]).map(x=>'· '+x).join('\n')+'\n\n风险提示\n'+(data.risks||[]).map(x=>'· '+x).join('\n')+'\n\n参数倾向\n'+(data.paramHint||'');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const el=$('#ai-stream');clearInterval(aiTimer);
  if(reduce){el.textContent=nar;return;}
  const start=Date.now(),speed=95;
  aiTimer=setInterval(()=>{const i=Math.floor((Date.now()-start)/1000*speed);el.textContent=nar.slice(0,Math.min(i,nar.length))+(i<nar.length?'▋':'');if(i>=nar.length)clearInterval(aiTimer);},30);
}

function wf(v){return (v/10000).toFixed(1)+'万';}
function planHealth(p,cur){
  const lv=p.levels||[];
  const totalCap=lv.reduce((s,l)=>s+(l.amount||0),0);
  const totalSh=lv.reduce((s,l)=>s+(l.shares||0),0);
  const low=lv.length?lv[lv.length-1].buy_price:p.base_price, top=p.base_price;
  cur=cur!=null?cur:top;
  const pct=Math.max(2,Math.min(98,(cur-low)/((top-low)||1)*100));
  const below=lv.filter(l=>l.buy_price<cur).sort((a,b)=>b.buy_price-a.buy_price)[0];
  const nextBuy=below?below.buy_price:low, distBuy=cur>0?(cur-nextBuy)/cur*100:0;
  const above=lv.filter(l=>l.sell_price>cur).sort((a,b)=>a.sell_price-b.sell_price)[0];
  const nextSell=above?above.sell_price:null, distSell=nextSell&&cur>0?(nextSell-cur)/cur*100:null;
  const maxLoss=totalSh*low-totalCap;
  let status,scol;
  if(cur<low){status='跌破区间';scol='var(--red)';}
  else if(cur>=top){status='高位运行';scol='var(--green)';}
  else{status='区间内';scol='var(--amber)';}
  return {p,lv,totalCap,totalSh,maxLoss,cur,low,top,pct,status,scol,nextBuy,distBuy,nextSell,distSell};
}

/* 上移重开的估值闸门：重开前先按标的名称关联监控池指数，展示当前分位与雷达结论；
   分位 >50%（雷达否决线）时降级为警告确认，关联不上也给通用提醒。
   纪律：估值允许才重置，不允许就收手——宁可空仓等低估，不在高估区开网。 */
function matchIndexBySymbolName(sname){
  if(!sname)return null;
  const strip=s=>(s||'').replace(/[ⅠⅡⅢ]$/,'');
  let best=null;
  for(const d of DATA){
    const nm=strip(d.name);
    if(nm&&sname.includes(nm)&&(!best||nm.length>strip(best.name).length))best=d;
  }
  return best;
}
function rebaseGate(id,cur,sname){
  const go=()=>rebasePlan(id,cur);
  const idx=matchIndexBySymbolName(sname);
  if(idx&&idx.valuation_pct!=null){
    const verdict=(LEVEL[idx.level]||{}).label||'—';
    if(idx.valuation_pct>50){
      toast(`⚠️ <b>${idx.name}</b> 当前估值分位 <b>${idx.valuation_pct}%</b>（雷达：${verdict}）。估值偏高，此时开网违背低估原则`,{type:'warn',action:{label:'仍要上移',fn:go}});
    }else{
      toast(`<b>${idx.name}</b> 当前估值分位 <b>${idx.valuation_pct}%</b>（雷达：${verdict}），可以上移重开`,{action:{label:'确认上移',fn:go}});
    }
  }else{
    toast('未能关联到监控指数 · 重开前请先在雷达页确认估值仍在低位',{action:{label:'确认上移',fn:go}});
  }
}
/* 上移重开：把基准价上移到现价、按原参数新建网格，旧计划归档(closed)。
   用于"已卖空、仍想参与"的场景——比手动删了重建更稳，也保留历史。 */
async function rebasePlan(id,cur){
  let plan;
  try{plan=await api('/api/grid/plans/'+id);}catch(e){toast('载入失败 · '+e.message,{type:'err'});return;}
  const np={name:plan.name,symbol:plan.symbol,symbol_name:plan.symbol_name,base_price:+(+cur).toFixed(4),

/* command line */
function cmdOpen(){return $('#cmd').classList.contains('show');}
let cmdSel=0;
function openCmd(){$('#cmd').classList.add('show');$('#cmd-backdrop').classList.add('show');
  const i=$('#cmd-input');i.value='';cmdSel=0;renderCmd();setTimeout(()=>i.focus(),0);}
function closeCmd(){$('#cmd').classList.remove('show');$('#cmd-backdrop').classList.remove('show');}
function cmdMatches(){const q=$('#cmd-input').value.trim().toLowerCase();
  return q?CMDS.filter(c=>(c.k+' '+c.label).toLowerCase().includes(q)):CMDS;}
function renderCmd(){const list=cmdMatches();if(cmdSel>=list.length)cmdSel=Math.max(0,list.length-1);
  const box=$('#cmd-list');
  box.innerHTML=list.length?list.map((c,i)=>`<div class="cmd-item ${i===cmdSel?'sel':''}" data-i="${i}" role="option" aria-selected="${i===cmdSel}"><span class="k">${c.k}</span><span>${c.label}</span></div>`).join('')
    :'<div class="cmd-empty">无匹配命令</div>';
  box.querySelectorAll('.cmd-item[data-i]').forEach(el=>{
    el.onmouseenter=()=>{cmdSel=+el.dataset.i;renderCmd();};
    el.onclick=()=>runCmd();});
}
function runCmd(){const list=cmdMatches(),c=list[cmdSel];if(c){closeCmd();c.run();}}

/* shortcuts panel */
function keysOpen(){return $('#keys').classList.contains('show');}
function openKeys(){$('#keys').classList.add('show');}
function closeKeys(){$('#keys').classList.remove('show');}
function toggleKeys(){keysOpen()?closeKeys():openKeys();}

/* command-line input handling (own listener; isolated from globals) */
$('#cmd-input').addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.stopPropagation();closeCmd();return;}
  if(e.key==='ArrowDown'){e.preventDefault();cmdSel++;const n=cmdMatches().length;if(cmdSel>=n)cmdSel=0;renderCmd();return;}
  if(e.key==='ArrowUp'){e.preventDefault();cmdSel--;if(cmdSel<0)cmdSel=Math.max(0,cmdMatches().length-1);renderCmd();return;}
  if(e.key==='Enter'){e.preventDefault();runCmd();return;}
});
$('#cmd-input').addEventListener('input',()=>{cmdSel=0;renderCmd();});
$('#cmd-backdrop').addEventListener('click',closeCmd);
$('#kbd-hint').addEventListener('click',toggleKeys);

/* global shortcuts */
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(cmdOpen())return;                      // command line owns keys while open
  if(e.key==='Escape'){
    document.querySelectorAll('.btn.confirming').forEach(resetConfirm);
    closeKeys();hideToast();closeAIPanel();
    if(inField(e))e.target.blur();
    return;
  }
  if(inField(e))return;                       // don't hijack typing
  if(e.key>='1'&&e.key<='7'){go(TABS[+e.key-1]);return;}
  if(e.key==='/'){e.preventDefault();focusSearch();return;}
  if(e.key===':'){e.preventDefault();openCmd();return;}
  if(e.key==='?'){e.preventDefault();toggleKeys();return;}
});

/* planner field-level validation. requireSymbol=true on SAVE (preview tolerates a blank code) */
function validatePlanner(requireSymbol){
  const checks=[
    ['#g-base',  v=>+v>0?'':'需大于 0'],
    ['#g-step',  v=>(+v>0&&+v<=50)?'':'0–50 之间'],
    ['#g-count', v=>(Number.isInteger(+v)&&+v>=1&&+v<=50)?'':'1–50 的整数'],
    ['#g-amount',v=>+v>=100?'':'至少 100'],
    ['#g-inc',   v=>(+v>=0&&+v<=50)?'':'0–50 之间'],
    ['#g-ret',   v=>(+v>=0&&+v<=100)?'':'0–100 之间'],
  ];
  if(requireSymbol)checks.unshift(['#g-symbol',v=>v.trim()?'':'保存前请填写标的代码']);
  let ok=true,first=null;
  checks.forEach(([sel,fn])=>{const el=$(sel);if(!el)return;const msg=fn(el.value);setFieldErr(sel,msg);if(msg){ok=false;if(!first)first=el;}});
  if(first)first.focus();
  return ok;
}

let optToken=0;
async function renderOpt(p){
  $('#p-opt-band').style.display='';
  if(!p.symbol){$('#opt-grid').innerHTML='<div class="bt-hint">选用 ETF 后可做参数寻优</div>';return;}
  $('#opt-grid').innerHTML='<div class="bt-hint">扫描参数中…</div>';
  const my=++optToken;
  let res;
  try{res=await api('/api/grid/optimize',{method:'POST',body:JSON.stringify({symbol:p.symbol,grid_step:p.grid_step,grid_count:p.grid_count,amount_per_grid:p.amount_per_grid,step_increase:p.step_increase,profit_retention:p.profit_retention,lookback_days:250})});}
  catch(e){if(my!==optToken)return;$('#opt-grid').innerHTML='<div class="bt-hint" style="color:var(--amber)">寻优失败 · '+e.message+'</div>';return;}
  if(my!==optToken)return;
  const cells=res.cells,best=res.best,steps=res.steps,counts=res.counts;
  const lo=Math.min(...cells.map(c=>c.score)),hi=Math.max(...cells.map(c=>c.score));
  const norm=v=>hi>lo?(v-lo)/(hi-lo):0.5;
  let html='<table class="opt-tbl"><thead><tr><th class="corner">间距\\格数</th>'+counts.map(ct=>`<th>${ct}格</th>`).join('')+'</tr></thead><tbody>';
  steps.forEach(st=>{html+=`<tr><th>${st}%</th>`+counts.map(ct=>{const c=cells.find(x=>x.step===st&&x.count===ct);const a=0.06+0.34*norm(c.score);const isBest=best&&c.step===best.step&&c.count===best.count;
    return `<td><button class="opt-cell ${isBest?'best':''}" data-st="${st}" data-ct="${ct}" style="background:rgba(69,199,106,${a.toFixed(3)})" title="收益 ${c.ret}% · 回撤 ${c.dd}% · 套利 ${c.trades}次">`+
      `<div class="r" style="color:${c.ret>=0?'#D7DEE7':'#F05B50'}">${c.ret>=0?'+':''}${c.ret.toFixed(0)}%</div>`+
      `<div class="d">${isBest?'<span class="bestlb">☆最优</span>':'回撤 '+c.dd.toFixed(0)+'%'}</div></button></td>`;}).join('')+'</tr>';});
  html+='</tbody></table>';
  $('#opt-grid').innerHTML=html;
  $('#opt-grid').querySelectorAll('.opt-cell').forEach(b=>b.onclick=()=>{$('#g-step').value=b.dataset.st;$('#g-count').value=b.dataset.ct;clearFieldErr('#g-step');clearFieldErr('#g-count');toast(`应用参数 · 间距 <b>${b.dataset.st}%</b> · <b>${b.dataset.ct}</b>格`);plannerPreview();});
}

        <div class="field"><label for="t-fee">手续费</label><input id="t-fee" type="number" step="0.01" min="0" value="0"><div class="msg"></div></div>
      </div>
      <div class="btnrow"><button class="btn primary" id="t-add">+ 保存交易 SAVE</button></div>
    </div>
    <div class="kpibar c4" id="t-summary"></div>
    <div class="band">
      <div class="band-head"><div class="t"><span class="bar">▌</span>POSITIONS · 持仓</div></div>
      <table id="t-pos"><thead><tr>
        <th class="l nos">SYMBOL</th><th class="nos">SHARES</th><th class="nos">COST ¥</th><th class="nos">AVG</th>
        <th class="nos">REALIZED ¥</th><th class="nos">FEE ¥</th><th class="nos">B/S</th>
      </tr></thead><tbody></tbody></table>
    </div>
    <div class="band">
      <div class="band-head"><div class="t"><span class="bar">▌</span>TRADE LOG · 明细</div><div class="d" id="t-count">—</div></div>
      <table id="t-log"><thead><tr>
        <th class="l nos">DATE</th><th class="l nos">SYMBOL</th><th class="nos">DIR</th><th class="nos">PRICE</th>
        <th class="nos">SHARES</th><th class="nos">AMOUNT ¥</th><th class="nos">FEE</th><th class="nos"></th>
      </tr></thead><tbody></tbody></table>
      <div class="foot-note">// 已实现收益 = 卖出价 − 移动加权平均成本，扣手续费</div>
    </div>`;
  $('#t-date').value=new Date().toISOString().slice(0,10);
  $('#t-add').onclick=async()=>{
    if(!validateTrade()){toast('保存失败 · 请修正高亮的字段',{type:'err'});return;}
    const btn=$('#t-add');btn.disabled=true;
    try{await api('/api/trades',{method:'POST',body:JSON.stringify({
      symbol:$('#t-symbol').value.trim(),symbol_name:$('#t-sname').value,trade_date:$('#t-date').value,
      direction:$('#t-dir').value,price:+$('#t-price').value,shares:+$('#t-shares').value,fee:+$('#t-fee').value||0})});
      ['#t-symbol','#t-sname','#t-price','#t-shares'].forEach(s=>$(s).value='');$('#t-fee').value='0';
      toast('交易已记录');renderTradeTables();
    }catch(e){toast('保存失败 · '+e.message,{type:'err'});}
    finally{btn.disabled=false;}
  };
  ['#t-symbol','#t-date','#t-price','#t-shares','#t-fee'].forEach(sel=>{const el=$(sel);if(el)el.addEventListener('input',()=>clearFieldErr(sel));});
  renderTradeTables();
};
function validateTrade(){
  const checks=[
    ['#t-symbol',v=>v.trim()?'':'必填'],
    ['#t-date',  v=>v?'':'必填'],
    ['#t-price', v=>+v>0?'':'需大于 0'],
    ['#t-shares',v=>(+v>0&&+v%100===0)?'':'>0 且为 100 整数倍'],
    ['#t-fee',   v=>+v>=0?'':'不能为负'],
  ];
  let ok=true,first=null;
  checks.forEach(([sel,fn])=>{const el=$(sel);if(!el)return;const msg=fn(el.value);setFieldErr(sel,msg);if(msg){ok=false;if(!first)first=el;}});
  if(first)first.focus();
  return ok;
}
async function renderTradeTables(){
  let summary,trades;
  try{[summary,trades]=await Promise.all([api('/api/summary'),api('/api/trades')]);}
  catch(e){toast('读取交易失败 · '+e.message,{type:'err'});return;}
  const pos=summary.positions||[];
  $('#t-count').textContent=`${trades.length} records`;
  $('#t-summary').innerHTML=[
    ['lz','已实现收益','¥'+fmt(summary.total_realized_pnl),summary.total_realized_pnl>=0?'盈':'亏'],
    ['cap','持仓成本','¥'+fmt(summary.total_holding_cost),'当前在仓'],
    ['static','累计手续费','¥'+fmt(summary.total_fee),'交易摩擦'],
    ['static','持仓标的',''+summary.position_count,'只'],
  ].map(([cls,lab,v,foot])=>`<div class="kpi static ${cls}"><div class="lab">${lab}</div><div class="v sm ${cls==='lz'?pnlCls(summary.total_realized_pnl):''}">${v}</div><div class="foot">${foot}</div></div>`).join('');
  $('#t-pos').querySelector('tbody').innerHTML=pos.map(p=>`<tr>
    <td class="l sans"><b>${p.symbol}</b> <span class="m">${p.symbol_name||''}</span></td><td>${fmt(p.shares,0)}</td><td>${fmt(p.cost)}</td>
    <td>${p.avg_cost?fmt(p.avg_cost,3):'—'}</td><td class="${pnlCls(p.realized_pnl)}">${fmt(p.realized_pnl)}</td>
    <td class="m">${fmt(p.total_fee)}</td><td class="m">${p.buy_count}/${p.sell_count}</td></tr>`).join('')||'<tr class="empty"><td colspan="7">暂无持仓 · <span class="ehint">在上方录入第一笔买入即可建仓</span></td></tr>';
  $('#t-log').querySelector('tbody').innerHTML=trades.map(t=>`<tr>
    <td class="l">${t.trade_date}</td><td class="l sans"><b>${t.symbol}</b> <span class="m">${t.symbol_name||''}</span></td>
    <td class="${t.direction==='buy'?'g':'r'}">${t.direction==='buy'?'BUY':'SELL'}</td><td>${fmt(t.price,3)}</td>
    <td>${fmt(t.shares,0)}</td><td>${fmt(t.amount)}</td><td class="m">${fmt(t.fee)}</td>
    <td style="text-align:right"><button class="btn sm danger" data-d="${t.id}">DEL</button></td></tr>`).join('')||'<tr class="empty"><td colspan="8">暂无交易 · <span class="ehint">填写上方表单保存第一笔成交</span></td></tr>';
  $('#t-log').querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>armConfirm(b,async()=>{
    const id=+b.dataset.d,removed=trades.find(x=>x.id===id);
    try{await api('/api/trades/'+id,{method:'DELETE'});}catch(err){toast('删除失败 · '+err.message,{type:'err'});return;}
    renderTradeTables();
    toast(`${removed?removed.trade_date:''} <b>${removed?removed.symbol:''}</b> 记录已删除`,{action:{label:'撤销',fn:async()=>{
      try{await api('/api/trades',{method:'POST',body:JSON.stringify({symbol:removed.symbol,symbol_name:removed.symbol_name,trade_date:removed.trade_date,direction:removed.direction,price:removed.price,shares:removed.shares,fee:removed.fee})});renderTradeTables();toast('已恢复');}
      catch(err){toast('恢复失败 · '+err.message,{type:'err'});}
    }}});
  }));
}

RENDER.docs=function(){
  $('#page-docs').innerHTML=`
    <div class="titlerow"><h1>DOCS</h1><div class="desc">// ETF拯救世界（E大）网格理念 &amp; 系统使用说明</div></div>

      <div class="sec">
        <h3>ABOUT · 关于</h3>
        <p>「ETF拯救世界」（人称 <b>E大</b>）的核心主张：普通人靠择时选股难以长期跑赢市场，但可以通过 <b>低估值买入宽基/不死行业指数 + 网格反复高抛低吸</b>，把市场的波动变成自己的收益。</p>
        <p class="m">本系统把这套方法论工具化 —— 帮你判断「何时买」「怎么布网」「扛不扛得住」「赚了多少」。</p>
      </div>
      <div class="sec">
        <h3>CORE IDEAS · 三条核心理念</h3>
        <div class="idea"><div class="num">1</div><div><h4>低估值是安全垫</h4><p>只在历史估值低位区建仓。估值越低，下跌空间越小、上涨空间越大。系统把「估值分位 &gt; 50%」直接判为不建议开网格（VETO）。</p></div></div>
        <div class="idea"><div class="num">2</div><div><h4>网格赚的是波动的钱</h4><p>跌一格买、涨一格卖，机械执行不预测。震荡越剧烈，来回差价赚得越多 —— 所以需要标的有足够波动，也决定建议格距。</p></div></div>
        <div class="idea"><div class="num">3</div><div><h4>只买「不死」的标的</h4><p>越跌越买的前提是它跌下去早晚会回来。因此只选宽基与国家经济命脉行业（券商、银行、医药、消费等）。</p></div></div>
      </div>
      <div class="sec">
        <h3>WORKFLOW · 五步走</h3>
        <ol class="steps">
          <li><b>RADAR 网格雷达</b> — 打开第一眼看这里，系统已按 SCORE 排序，<span class="g">GO</span> = 现在适合开网格。</li>
          <li><b>点击 GO/PROBE 行</b> — 自动带建议参数跳到 PLANNER。记得把基准价改成你要买的 ETF 实际价格。</li>
          <li><b>PLANNER 规划器</b> — 调格距/格数/每格金额，看 GRID LADDER 与 <span class="a">PRESSURE TEST</span>，确认资金扛得住再 SAVE。</li>
          <li><b>实盘下单</b> — 按档位表在券商 App 挂单买卖。</li>
          <li><b>TRADES 交易记录</b> — 每笔成交录进来，自动算持仓成本与已实现收益。</li>
        </ol>
      </div>
      <div class="sec">
        <h3>GLOSSARY · 一分钟看懂</h3>
        <div class="kv">
          <div class="k">估值分位</div><div class="vv">当前估值比历史多少比例的时间更贵。10% = 比历史 90% 的时间都便宜，越低越好。</div>
          <div class="k">网格 1.0</div><div class="vv">跌一格买、涨一格卖，纯赚差价。</div>
          <div class="k">网格 2.0</div><div class="vv">卖出时留一部分利润份额不卖，长期积累「免费底仓」，吃长期上涨。</div>
          <div class="k">逐格加码</div><div class="vv">越往下跌，每格买入金额越大，摊低持仓成本。</div>
          <div class="k">压力测试</div><div class="vv">假设跌到最低格，算出总资金需求和最大浮亏 —— 开网格前的必做功课。</div>
        </div>
      </div>
      <div class="sec">
        <h3>RISK · 重要提醒</h3>
        <div class="warn">
          <p><b>低估 ≠ 不会跌。</b> 估值低只是概率上的安全，短期仍可能继续下跌，所以才需要网格分批接、需要压力测试。</p>
          <p><b>资金一定要扛得住满仓。</b> 网格最大的死法是跌到一半没钱补了，前功尽弃。</p>
          <p><b>这是工具，不是投顾。</b> 所有评分和建议仅供参考，不构成任何投资建议，盈亏自负。</p>

/* ticker (persistent) */
function renderTicker(){
  if(!DATA.length){
    $('#ticker').innerHTML=`<div class="seg2">SIGNALS&nbsp; <b class="m">${readinessError?'引擎离线':'尚无估值数据'}</b></div>`+
      `<div class="seg2" style="margin-left:auto;border-right:none;border-left:1px solid var(--line);">${readinessError?'ENGINE ERROR':'AWAITING BACKFILL'}</div>`;
    return;
  }
  const top=DATA.filter(d=>d.level==='go').sort((a,b)=>b.score-a.score);
  $('#ticker').innerHTML=
    `<div class="seg2">SIGNALS&nbsp; <b class="g">GO ${cnt('go')}</b> · <b class="a">PROBE ${cnt('maybe')}</b> · <b>WAIT ${cnt('wait')}</b> · <b class="r">VETO ${cnt('no')}</b></div>`+
    `<div class="seg2">BEST&nbsp; ${top.slice(0,4).map(d=>`<b>${d.name}</b> <span class="g">${d.score}</span>`).join(' &nbsp;|&nbsp; ')||'—'}</div>`+
    `<div class="seg2" style="margin-left:auto;border-right:none;border-left:1px solid var(--line);">ENGINE OK · ${DATA.length} TARGETS SCORED</div>`;
}
